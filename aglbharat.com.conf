server {
    listen 80;
    server_name aglbharat.com www.aglbharat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aglbharat.com www.aglbharat.com;

    # SSL configuration (handled by Certbot, but adding http2 here)
    # The actual SSL paths will be added by certbot below or kept if already there

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://localhost:3025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Caching for static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|pdf)$ {
        proxy_pass http://localhost:3025;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
