server {
    server_name aglbharat.com www.aglbharat.com;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # HTTP/2 support (modern way)
    http2 on;

    location / {
        proxy_pass http://localhost:3025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Caching for static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|pdf)$ {
        proxy_pass http://localhost:3025;
        expires 30d;
        add_header Cache-Control 'public, no-transform';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aglbharat.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aglbharat.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.aglbharat.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = aglbharat.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name aglbharat.com www.aglbharat.com;
    return 404; # managed by Certbot
}
